name: Nix PR validation

on:
  pull_request:
    branches:
      - linux/rust
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'linux-rust/**'
      - '.github/workflows/ci-nix-pr.yml'
  workflow_dispatch: {}

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout pull request or update branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Merge current target branch
        env:
          BASE_REF: linux/rust
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git merge --no-commit --no-ff "origin/${BASE_REF}"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Validate flake
        run: nix flake check --no-build

      - name: Build package
        run: nix build .#packages.x86_64-linux.default --no-link
