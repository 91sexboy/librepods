name: Issue 873 Android source verification
run-name: Issue 873 verification ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit whose Android tree must match this CI ref
        required: true
        type: string

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - name: Verify exact Android source mapping
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$EXPECTED_SOURCE_SHA^{commit}"
          git diff --exit-code "$EXPECTED_SOURCE_SHA" HEAD -- android
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          source = os.environ['EXPECTED_SOURCE_SHA']
          payload = {
              'source_sha': source,
              'ci_sha': git('rev-parse', 'HEAD'),
              'android_tree': git('rev-parse', source + ':android'),
              'native_source_sha256': hashlib.sha256(pathlib.Path('android/app/src/main/cpp/l2c_fcr_hook.cpp').read_bytes()).hexdigest(),
              'scope': 'native SDP registration; original OEM crash unverified',
          }
          pathlib.Path('source-proof.json').write_text(json.dumps(payload, indent=2) + '\n')
          print(json.dumps(payload))
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Compile real native hook and regression fixture
        run: |
          cmake -S android/tests/native -B "$RUNNER_TEMP/librepods-native-tests"
          cmake --build "$RUNNER_TEMP/librepods-native-tests" --parallel 2
      - name: Run native SDP behavior regressions
        run: ctest --test-dir "$RUNNER_TEMP/librepods-native-tests" --output-on-failure --no-tests=error
      - name: Install exact source SDK and NDK
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess, urllib.request, zipfile
          root = pathlib.Path(os.environ['ANDROID_HOME'])
          scratch = pathlib.Path(os.environ['RUNNER_TEMP'])
          archive = scratch / 'commandlinetools-23.zip'
          urllib.request.urlretrieve('https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip', archive)
          if hashlib.sha1(archive.read_bytes()).hexdigest() != 'e025545c62a8e64c7559119566a569fb1dec5f60':
              raise RuntimeError('Official command-line tools checksum mismatch')
          destination = scratch / 'sdk-tools-23'
          with zipfile.ZipFile(archive) as package:
              package.extractall(destination)
          sdk = destination / 'cmdline-tools/bin/sdkmanager'
          sdk.chmod(0o755)
          args = [str(sdk), '--sdk_root=' + str(root)]
          subprocess.run([*args, '--licenses'], input='y\n' * 1000, text=True, check=True)
          subprocess.run([*args, 'platforms;android-37.0', 'ndk;30.0.14904198', 'cmake;3.22.1'], check=True)
          PY
      - name: Run Android unit-test task and build FOSS debug APK
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g' '-Dkotlin.daemon.jvm.options=-Xmx2g' testFossDebugUnitTest assembleFossDebug
      - name: Upload exact-source debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-873-debug-apk
          path: android/app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload native diagnostics and source proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-873-native-proof
          path: |
            source-proof.json
            ${{ runner.temp }}/librepods-native-tests/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 14
