name: Android CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: main
  workflow_call:

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.RELEASE_KEYSTORE_FILE }}" | base64 --decode > android/release.keystore
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept Licenses
        run: yes | sdkmanager --licenses
      - name: Install NDK
        run: sdkmanager "ndk;30.0.14904198"
      - name: Create local.properties
        if: github.event_name != 'pull_request'
        run: |
          cat <<EOF > android/local.properties
          RELEASE_STORE_FILE=../release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF
      - name: Build debug APK for PRs
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleFossDebug
        working-directory: android
      - name: Build release artifacts
        if: github.event_name != 'pull_request'
        run: ./gradlew collectReleaseArtifacts
        working-directory: android
      - name: Get app version
        id: version
        working-directory: android
        run: |
          VERSION_OUTPUT=$(./gradlew -q printAppVersion)
          echo "$VERSION_OUTPUT" | sed -n 's/^VERSION_NAME=/app_version=/p' >> "$GITHUB_OUTPUT"
      - id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: apk-release
          path: release/*release.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/foss/debug/app-foss-debug.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: apk-debug
          path: release/*debug.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release-bundle
          path: release/*.aab

  release:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/android/rewrite')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release tag
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=nightly-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "title=Nightly ${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "description=Download the latest debug and release APKs." >> "$GITHUB_OUTPUT"
          else
            NEW_TAG="rewrite-v${APP_VERSION}"

            LAST_TAG=$(gh release list \
              --limit 1000 \
              --json tagName,publishedAt |
              jq -r '[.[] | select(.tagName | startswith("rewrite-"))]
                | sort_by(.publishedAt)
                | last
                | .tagName // empty')

            if [[ "$NEW_TAG" == "$LAST_TAG" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Version ${APP_VERSION} already released; skipping prerelease."
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
              echo "title=v${APP_VERSION} (rewrite)" >> "$GITHUB_OUTPUT"
              echo "description=Download rewrite testing versions. THINGS WILL BE BROKEN!" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download release APK
        if: steps.release_check.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: artifacts/apk-release

      - name: Download debug APK
        if: steps.release_check.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: artifacts/apk-debug

      - name: Find previous release
        if: steps.release_check.outputs.publish == 'true'
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            PREFIX="nightly-"
          else
            MAJOR="${APP_VERSION%%.*}"
            PREFIX="rewrite-v${MAJOR}."
          fi

          TAG=$(gh release list \
            --limit 1000 \
            --json tagName,publishedAt |
            jq -r --arg prefix "$PREFIX" \
              '[.[] | select(.tagName | startswith($prefix))]
              | sort_by(.publishedAt)
              | last
              | .tagName // empty')

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        if: steps.release_check.outputs.publish == 'true'
        id: changelog
        env:
          PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            if [ -z "$PREVIOUS_TAG" ]; then
              NOTES=$(git log --pretty=format:"- %s ([%h](https://github.com/kavishdevar/librepods/commit/%H))")
            else
              NOTES=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s ([%h](https://github.com/kavishdevar/librepods/commit/%H))")
            fi
          else
            if [ -z "$PREVIOUS_TAG" ]; then
              RANGE="HEAD"
            else
              RANGE="${PREVIOUS_TAG}..HEAD"
            fi

            NOTES=$(git log "$RANGE" \
              --pretty=format:"%s|%h|%H" |
              awk -F '|' '$1 ~ /^android/ {
                printf "- %s ([%s](https://github.com/kavishdevar/librepods/commit/%s))\n", $1, $2, $3
              }')
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create prerelease
        if: steps.release_check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_check.outputs.tag }}
          TITLE: ${{ steps.release_check.outputs.title }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          gh release create "$TAG" \
            artifacts/apk-release/* \
            artifacts/apk-debug/* \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease

      - name: Get timestamp
        if: steps.release_check.outputs.publish == 'true'
        id: timestamp
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        if: steps.release_check.outputs.publish == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_ANDROID_CI_URL }}
          RELEASE_TAG: ${{ steps.release_check.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_check.outputs.title }}
          RELEASE_DESCRIPTION: ${{ steps.release_check.outputs.description }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
        run: |
          jq -n \
            --arg title "$RELEASE_TITLE" \
            --arg description "$RELEASE_DESCRIPTION" \
            --arg timestamp "$TIMESTAMP" \
            --arg release_url "https://github.com/kavishdevar/librepods/releases/download/${RELEASE_TAG}/LibrePods-FOSS-v${APP_VERSION}-release.apk" \
            --arg debug_url "https://github.com/kavishdevar/librepods/releases/download/${RELEASE_TAG}/LibrePods-FOSS-v${APP_VERSION}-debug.apk" \
            '{
              embeds: [
                {
                  title: $title,
                  description: $description,
                  color: 253060,
                  timestamp: $timestamp,
                  footer: {
                    text: "GitHub Actions"
                  }
                }
              ],
              components: [
                {
                  type: 1,
                  components: [
                    {
                      type: 2,
                      label: "Download Release APK",
                      style: 5,
                      url: $release_url
                    },
                    {
                      type: 2,
                      label: "Download Debug APK",
                      style: 5,
                      url: $debug_url
                    }
                  ]
                }
              ]
            }' |
          curl --fail-with-body -X POST \
            "${DISCORD_WEBHOOK}?with_components=true" \
            -H "Content-Type: application/json" \
            --data-binary @-
